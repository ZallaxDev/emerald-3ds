[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emerald3ds-builder"
version = "0.5.0"
description = "Builds the Emerald 3DS data pack from the player's own Pokémon Emerald ROM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]
license = {text = "See LICENSE-PORT.md in the repository"}

[project.scripts]
emerald3ds-builder = "emerald3ds_builder.__main__:main"

[tool.setuptools]
packages = ["emerald3ds_builder"]
