name: CI

on:
  push:
  pull_request:

jobs:
  release-versions:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.versions.outputs.python }}
      pillow: ${{ steps.versions.outputs.pillow }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: versions
        name: Read the Python and Pillow release pins
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          python = tomllib.loads(Path("upstream.lock").read_text(encoding="utf-8"))["python"]
          version = python["image"].removeprefix("python:").split("-", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"python={version}", f"pillow={python['pillow']}", sep="\n", file=output)

  audit-and-python:
    needs: release-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "${{ needs.release-versions.outputs.python }}"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the release Pillow version
        env:
          PILLOW: ${{ needs.release-versions.outputs.pillow }}
        run: python -m pip install "Pillow==$PILLOW"
      - name: Publication audit
        run: python tools/release_audit.py --repo . --strict
      - name: Byte-compile all Python
        run: python -m compileall -q builder tools 3ds_port/scripts 3ds_port/tests
      - name: Builder tests (synthetic data, no ROM)
        run: python -m unittest discover -s builder/tests -v
      - name: Synthetic web payload passes the release contract audit
        run: |
          python tools/build_web_payload.py --synthetic synthetic-web
          python tools/release_audit.py --zip synthetic-web/Emerald3DS-WebPayload.zip --strict --web-payload

  host-tests:
    needs: release-versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ needs.release-versions.outputs.python }}
      - name: Data pack parser against the builder's writer
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -I3ds_port/include \
              3ds_port/tests/pak_test.c 3ds_port/src/3ds_pak.c -o pak_test
          ./pak_test test.pak "$(python 3ds_port/tests/make_test_pak.py test.pak)"
          python 3ds_port/tests/pak_bounds_test.py ./pak_test
      - name: Asset warm-up worker lifecycle
        run: |
          gcc -std=gnu99 -O2 -Wall -Wextra -Werror -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast \
              -ffunction-sections -fdata-sections -Wl,--gc-sections -pthread \
              -I3ds_port/tests/assets_host -I3ds_port/include -I3ds_port/compat \
              3ds_port/tests/assets_warmup_test.c 3ds_port/src/3ds_pak.c -o assets_warmup_test
          timeout 10s ./assets_warmup_test
      - name: Incremental voxel build dependencies
        run: python 3ds_port/tests/voxel_make_deps_test.py
      - name: Input and video decoding
        run: |
          cd 3ds_port
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/input_test.c src/3ds_input_decode.c -o input_test && ./input_test
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/video_decode_test.c src/3ds_video_decode.c -o video_test && ./video_test
      - name: Day/night clock and lighting
        run: make -C 3ds_port verify-daynight verify-clock-store verify-encounters verify-night-lamps
      - name: Standalone voxel shadows and mesh fixtures
        run: |
          make -C 3ds_port verify-voxel-lighting verify-voxel-trees build/voxel_ground_mesh_test.exe
          cd 3ds_port
          ./build/voxel_ground_mesh_test.exe
      - name: Voxel runtime, draft and GPU vertex packing
        run: make -C 3ds_port verify-voxel-runtime verify-voxel-draft verify-voxel-vertex-pack
      - name: Night window masks and building-page compatibility
        env:
          PILLOW: ${{ needs.release-versions.outputs.pillow }}
        run: |
          python -m pip install "Pillow==$PILLOW"
          python 3ds_port/tests/voxel_night_test.py --cc gcc
      - name: Bottom map and clock footer
        run: python 3ds_port/tests/bottom_map_test.py
      - name: Voxel Pillow bulk pixel and alpha equivalence
        run: python 3ds_port/tests/voxel_pillow_hotspots_test.py
      - name: Voxel image composition, raster and comparison equivalence
        run: python 3ds_port/tests/voxel_image_semantics_test.py
      - name: Sampling profiler output format regression
        run: python tools/test_profile_voxel.py
      - name: Experimental Pillow hotspots benchmark (non-gating)
        run: python tools/benchmark_pillow_hotspots.py
      - name: Live Bag snapshot bounds and selection
        run: python 3ds_port/tests/bottom_live_bag_test.py
      - name: Live Party cancelled handoffs and cursor normalization
        run: python 3ds_port/tests/bottom_live_party_test.py
      - name: Live Party/Bag settings persistence
        run: |
          gcc -std=gnu99 -O2 -Wall -Wextra -Werror -I3ds_port/tests/settings_host -I3ds_port/include \
              3ds_port/tests/settings_shutdown_test.c -pthread -o settings_shutdown_test
          ./settings_shutdown_test

  build-3ds:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the pinned release environment
        id: release-image
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          from tools.docker_release import image

          lock = tomllib.loads(Path("upstream.lock").read_text(encoding="utf-8"))
          tag = image(lock)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={tag}", file=output)
          PYTHON
      - name: Build and verify the engine in the release environment
        env:
          RELEASE_IMAGE: ${{ steps.release-image.outputs.tag }}
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/work" -w /work "$RELEASE_IMAGE" bash -e <<'BUILD'
          echo "::group::Bootstrap and prepare upstream sources"
          python3 -m py_compile tools/port_common/gen_asset_table.py
          python3 builder/tests/test_asset_table_compatibility.py
          python3 tools/bootstrap.py
          make -C build/upstream -j4 tools
          make -C build/upstream -j4 generated
          echo "::endgroup::"

          echo "::group::3DS build, verification and engine-only release"
          # verify builds all first, and release waits for verification.
          VOXEL_TERRACE_JOBS=4 VOXEL_BUILDING_JOBS=4 VOXEL_SCENE_JOBS=4 \
            make -C build/upstream/3ds_port -j4 --output-sync=target verify release PYTHON=python3 PORT_LANG=en
          echo "::endgroup::"

          echo "::group::Production encounter and berry clock tests"
          python3 3ds_port/tests/encounter_tables_test.py --tree build/upstream
          python3 3ds_port/tests/berry_clock_test.py --tree build/upstream
          echo "::endgroup::"

          echo "::group::Publication audit"
          mkdir -p ship
          cp build/upstream/3ds_port/dist/Emerald3DS.3dsx build/upstream/3ds_port/dist/Emerald3DS.smdh ship/
          # In payload/, where the release ships them (release_audit_allow.toml [large]).
          python3 -c "import zipfile,pathlib; z=zipfile.ZipFile('ship.zip','w'); [z.write(p, 'payload/' + p.name) for p in pathlib.Path('ship').iterdir()]"
          python3 tools/release_audit.py --zip ship.zip --strict
          echo "::endgroup::"
          BUILD
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: emerald3ds-engine
          path: ship/

  # Investigation only. The long comparison runs only on the draft PR branch;
  # remove this job before merging.
  pillow-ab-benchmark:
    strategy:
      fail-fast: false
      matrix:
        building_jobs: [1, 4]
    # Re-run the paired benchmark for the substantive image/raster optimizations.
    # Leave the PR draft until verified image proofs and all asset hashes agree.
    if: github.event_name == 'pull_request' && github.head_ref == 'investigate/pillow-bulk-pixel-processing'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: ZallaxDev/emerald-3ds
          ref: 6de1c53dfa20a9f4c2d381bfc2c827775ac8eb6d
          path: benchmark-base
          persist-credentials: false
      - name: Prepare pinned Python, Pillow and devkitPro release image
        id: image
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from tools.docker_release import image

          lock = tomllib.loads(Path("upstream.lock").read_text(encoding="utf-8"))
          tag = image(lock)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={tag}", file=output)
          PY
      - name: Generate shared inputs; run 5 alternating full-generator A/B pairs
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PYTHONHASHSEED=0 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work "$RELEASE_IMAGE" bash -e <<'BENCH'
          export VOXEL_TERRACE_JOBS=4
          echo "::group::Prepare the upstream tree and voxel inputs (no complete 3DS build)"
          python3 tools/bootstrap.py
          make -C build/upstream tools -j4
          # Only the tileset/region/terrain inputs are needed for the measured
          # generators. The full 'bootstrap --make' unnecessarily rebuilds
          # the entire game's graphics and 3DS executable before trial 1.
          make -C build/upstream/3ds_port -j4 PYTHON=python3 \
            romfs/voxel/regions.bin romfs/voxel/signposts.bin build/voxel_relief_base.bin
          echo "::endgroup::"
          echo "::group::Five paired A/B rounds, same prepared tree"
          python3 -u tools/benchmark_pillow_generators_ab.py \
            --tree build/upstream --baseline-dir benchmark-base \
            --runs 5 --verify-buildings --building-jobs "${{ matrix.building_jobs }}" --output benchmark-results
          echo "::endgroup::"
          BENCH
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pillow-ab-benchmark-${{ matrix.building_jobs }}-workers
          path: benchmark-results/
          retention-days: 10

  # Investigation-only: locate hot functions before implementing larger Pillow
  # changes. The export-only A/B did not show an overall speedup. Profile the
  # verified building path too; it is substantially more image/raster heavy.
  pillow-sampling-profile:
    # Already profiling on the previous commit; favor the controlled comparison.
    if: false
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare pinned release image
        id: image
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from tools.docker_release import image

          lock = tomllib.loads(Path("upstream.lock").read_text(encoding="utf-8"))
          tag = image(lock)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={tag}", file=output)
          PY
      - name: Profile full verified building generator and relief generator
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PYTHONHASHSEED=0 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/work" -w /work "$RELEASE_IMAGE" bash -e <<'PROFILE'
          python3 tools/bootstrap.py
          make -C build/upstream tools -j4
          make -C build/upstream/3ds_port -j4 PYTHON=python3 \
            romfs/voxel/regions.bin romfs/voxel/signposts.bin build/voxel_relief_base.bin
          python3 -u tools/profile_voxel.py --tree build/upstream --out voxel-profiles \
            --profiler sampling --verify-buildings --steps buildings relief
          for f in voxel-profiles/*-hotspots.txt; do
            echo "====== $f (top sampled CPU hot spots) ======"
            sed -n '1,100p' "$f"
          done
          PROFILE
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pillow-verified-generator-profiles
          path: voxel-profiles/
          retention-days: 10
