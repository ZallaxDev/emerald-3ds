name: CI
run-name: Compare current and v7 CI helpers

on:
  push:
    branches: [test/mkrieger95-ci-helper-comparison]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  current-first:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: Preinstall the common Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15.2"
      - name: Fetch the common engine payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/ZallaxDev/emerald-3ds/actions/artifacts/14486395069/zip > "$RUNNER_TEMP/engine.zip"
          mkdir payload
          python -m zipfile -e "$RUNNER_TEMP/engine.zip" payload
          sha256sum payload/* > "$RUNNER_TEMP/expected.sha256"
          cat "$RUNNER_TEMP/expected.sha256"
          python -m pip install "Pillow==13.0.0"
      - name: "baseline checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ZallaxDev/emerald-3ds
          ref: b9343f55ab961d03e750faf9e05d34744fe19396
          path: source-baseline
      - name: "baseline Python setup"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15.2"
      - name: "baseline compatibility checks"
        working-directory: source-baseline
        env:
          PYTHON_CPU_COUNT: "1"
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: |
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY" no_proxy="$NO_PROXY"
          python -c "import sys,PIL; assert sys.version_info[:3] == (3,15,2); assert PIL.__version__ == '13.0.0'"
          test "$(git rev-parse HEAD)" = "b9343f55ab961d03e750faf9e05d34744fe19396"
          python -c "from pathlib import Path; print('Authorization header stored directly in git config:', 'AUTHORIZATION:' in Path('.git/config').read_text())"
          python tools/release_audit.py --repo . --strict
          python -m unittest discover -s builder/tests
          python tools/build_web_payload.py --synthetic synthetic-web
          python tools/release_audit.py --zip synthetic-web/Emerald3DS-WebPayload.zip --strict --web-payload
      - name: "baseline artifact upload"
        id: upload-baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helpers-${{ github.run_id }}-${{ github.job }}-${{ matrix.sample }}-baseline
          path: payload/
          compression-level: 6
          retention-days: 1
      - name: "candidate checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZallaxDev/emerald-3ds
          ref: b9343f55ab961d03e750faf9e05d34744fe19396
          path: source-candidate
      - name: "candidate Python setup"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: "candidate compatibility checks"
        working-directory: source-candidate
        env:
          PYTHON_CPU_COUNT: "1"
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
        run: |
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY" no_proxy="$NO_PROXY"
          python -c "import sys,PIL; assert sys.version_info[:3] == (3,15,2); assert PIL.__version__ == '13.0.0'"
          test "$(git rev-parse HEAD)" = "b9343f55ab961d03e750faf9e05d34744fe19396"
          python -c "from pathlib import Path; print('Authorization header stored directly in git config:', 'AUTHORIZATION:' in Path('.git/config').read_text())"
          python tools/release_audit.py --repo . --strict
          python -m unittest discover -s builder/tests
          python tools/build_web_payload.py --synthetic synthetic-web
          python tools/release_audit.py --zip synthetic-web/Emerald3DS-WebPayload.zip --strict --web-payload
      - name: "candidate artifact upload"
        id: upload-candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helpers-${{ github.run_id }}-${{ github.job }}-${{ matrix.sample }}-candidate
          path: payload/
          compression-level: 6
          retention-days: 1
      - name: Verify both uploaded artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASELINE_ID: ${{ steps.upload-baseline.outputs.artifact-id }}
          CANDIDATE_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
        run: |
          for kind in baseline candidate; do
            artifact_id="$BASELINE_ID"
            if test "$kind" = candidate; then artifact_id="$CANDIDATE_ID"; fi
            error_log="$RUNNER_TEMP/$kind-download.log"
            for attempt in 1 2 3 4 5; do
              if gh api "/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/$kind.zip" 2>"$error_log"; then
                break
              fi
              if ! grep -Fq '(HTTP 404)' "$error_log" || test "$attempt" -eq 5; then
                cat "$error_log" >&2
                exit 1
              fi
              echo "Artifact $artifact_id is not available yet (attempt $attempt/5)"
              sleep "$((attempt * 2))"
            done
          done
          python - <<'VERIFY'
          import hashlib, os, pathlib, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path("payload").iterdir() if p.is_file()}
          for kind in ("baseline", "candidate"):
              with zipfile.ZipFile(root / f"{kind}.zip") as archive:
                  actual = {name: hashlib.sha256(archive.read(name)).hexdigest() for name in archive.namelist() if not name.endswith("/")}
              assert actual == expected, (kind, actual, expected)
              print(kind, "round-trip hashes match", "ZIP bytes", (root / f"{kind}.zip").stat().st_size)
          VERIFY
