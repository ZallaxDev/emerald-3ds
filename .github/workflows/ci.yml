name: CI

on:
  push:
  pull_request:

jobs:
  pokeruby-compile:
    # Experimental compile-only milestone, independent of Emerald's build.
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tools for the upstream charmap preprocessor
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 git
      - name: Prepare pinned Ruby/Sapphire source only
        run: python3 tools/bootstrap.py --game ruby
      - name: Compile real task and RNG modules for both English games
        run: python3 tools/check_pokeruby_3ds.py

  audit-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Publication audit
        run: python tools/release_audit.py --repo . --strict
      - name: Byte-compile all Python
        run: python -m compileall -q builder tools 3ds_port/scripts 3ds_port/tests
      - name: Builder tests (synthetic data, no ROM)
        run: python -m unittest discover -s builder/tests -v
      - name: Synthetic web payload passes the release contract audit
        run: |
          python tools/build_web_payload.py --synthetic synthetic-web
          python tools/release_audit.py --zip synthetic-web/Emerald3DS-WebPayload.zip --strict --web-payload

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data pack parser against the builder's writer
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -I3ds_port/include \
              3ds_port/tests/pak_test.c 3ds_port/src/3ds_pak.c -o pak_test
          ./pak_test test.pak "$(python 3ds_port/tests/make_test_pak.py test.pak)"
      - name: Input and video decoding
        run: |
          cd 3ds_port
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/input_test.c src/3ds_input_decode.c -o input_test && ./input_test
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/video_decode_test.c src/3ds_video_decode.c -o video_test && ./video_test
      - name: Day/night clock and lighting
        run: make -C 3ds_port verify-daynight verify-clock-store verify-encounters verify-night-lamps
      - name: Standalone voxel shadows and mesh fixtures
        run: |
          make -C 3ds_port verify-voxel-lighting verify-voxel-trees build/voxel_ground_mesh_test.exe
          cd 3ds_port
          ./build/voxel_ground_mesh_test.exe
      - name: Night window masks and building-page compatibility
        run: |
          python -m pip install Pillow
          python 3ds_port/tests/voxel_night_test.py --cc gcc
      - name: Bottom map and clock footer
        run: python 3ds_port/tests/bottom_map_test.py

  build-3ds:
    # Not ubuntu-latest: on Ubuntu 26.04 the container's AddressSanitizer
    # builds (pokedex_capture_test.py --sanitize) loop on DEADLYSIGNAL until
    # the runner is lost.
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential g++ libpng-dev python3 python3-pil git
      - name: Bootstrap and build
        run: |
          python3 -m py_compile tools/port_common/gen_asset_table.py
          python3 builder/tests/test_asset_table_compatibility.py
          python3 tools/bootstrap.py --make -j4 --python python3
      - name: Host tests and link audit
        run: make -C build/upstream/3ds_port verify PYTHON=python3
      - name: Production timed encounter rules
        run: python3 3ds_port/tests/encounter_tables_test.py --tree build/upstream
      - name: Production berry clock integration
        run: python3 3ds_port/tests/berry_clock_test.py --tree build/upstream
      - name: Engine-only 3DSX
        run: make -C build/upstream/3ds_port release PYTHON=python3
      - name: Audit the build outputs that would ship
        run: |
          mkdir -p ship && cp build/upstream/3ds_port/dist/Emerald3DS.3dsx build/upstream/3ds_port/dist/Emerald3DS.smdh ship/
          # In payload/, where the release ships them (release_audit_allow.toml [large]).
          python3 -c "import zipfile,pathlib; z=zipfile.ZipFile('ship.zip','w'); [z.write(p, 'payload/' + p.name) for p in pathlib.Path('ship').iterdir()]"
          python3 tools/release_audit.py --zip ship.zip --strict
      - uses: actions/upload-artifact@v4
        with:
          name: emerald3ds-engine
          path: ship/
