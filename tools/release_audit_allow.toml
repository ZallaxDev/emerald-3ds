[local_paths]
# Files allowed to mention a local path (documentation of the audit itself).
paths = ["tools/release_audit.py"]

[skip]
globs = []

[runtime]
# The builder's PyInstaller runtime: Python, Tcl/Tk, Pillow and their DLLs,
# shipped unmodified under their own licenses. Checked for ROMs, data packs
# and secrets, not for size or incidental byte runs.
globs = ["Emerald3DS-v*-Windows/_internal/*"]
