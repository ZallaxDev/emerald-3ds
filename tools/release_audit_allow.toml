# Explicit exceptions for tools/release_audit.py. Every entry needs a reason.

[large]
# Files over 1 MiB that are allowed (globs): the release's own executables.
paths = [
    # Numeric symbol names, addresses and sizes only; no ROM sections or text.
    "tools/locales/spanish-symbols.s.gz",
    "tools/locales/french-symbols.s.gz",
    "tools/locales/italian-symbols.s.gz",
    "Emerald3DS-v*-Windows/Emerald3DS-Builder.exe",
    "Emerald3DS-v*-Windows/emerald3ds-builder-cli.exe",
    "Emerald3DS-v*-Windows/payload/Emerald3DS.3dsx",
    # the other languages' executables (payload/es/ for the Spanish ROM)
    "Emerald3DS-v*-Windows/payload/*/Emerald3DS.3dsx",
    "Emerald3DS-v*-macOS/Emerald3DS-Builder",
    "Emerald3DS-v*-macOS/emerald3ds-builder-cli",
    "Emerald3DS-v*-macOS/payload/Emerald3DS.3dsx",
    "Emerald3DS-v*-macOS/payload/*/Emerald3DS.3dsx",
    # the same executables inside Emerald3DS-WebPayload.zip
    "payload/Emerald3DS.3dsx",
    "payload/*/Emerald3DS.3dsx",
]

[media]
# Images and binary assets allowed in the repository, with their provenance.
"3ds_port/assets/voxel/trees/tree_crown.png" = "original art by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/voxel/trees/tree_trunk.png" = "original art by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/voxel/trees/tree_small_crown.png" = "original art by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/voxel/trees/tree_small_trunk.png" = "original art by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/voxel/trees/tree_2_small_crown.png" = "original art by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/voxel/trees/tree_2_small_trunk.png" = "original art by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/artwork/icon.png" = "HOME Menu icon of the forwarder CIA, made by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/artwork/banner.png" = "HOME Menu banner of the forwarder CIA, made by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/artwork/banner-sound.wav" = "HOME Menu banner jingle of the forwarder CIA, made by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/artwork/logo.png" = "developer logo shown under the title screen, made by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/artwork/bottom/shoe_off.png" = "bottom screen RUN button icon, original pixel art by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/artwork/bottom/shoe_on.png" = "bottom screen RUN button icon (on), original pixel art by the Pokémon Emerald 3Ds Dual Screen author"
"3ds_port/assets/artwork/bottom/badge_y.png" = "bottom screen Y button badge, original pixel art by the Pokémon Emerald 3Ds Dual Screen author"

[local_paths]
# Files allowed to mention a local path (documentation of the audit itself).
paths = ["tools/release_audit.py"]

[skip]
globs = []

[runtime]
# The builder's PyInstaller runtime: Python, Tcl/Tk, Pillow and their DLLs,
# shipped unmodified under their own licenses. Checked for ROMs, data packs
# and secrets, not for size or incidental byte runs.
globs = [
    "Emerald3DS-v*-Windows/_internal/*",
    "Emerald3DS-v*-macOS/_internal/*",
]
