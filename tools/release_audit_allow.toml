# Explicit exceptions for tools/release_audit.py. Every entry needs a reason.

[large]
# Files over 1 MiB that are allowed (globs): the release's own executables.
paths = [
    # Numeric symbol names, addresses and sizes only; no ROM sections or text.
    "tools/locales/spanish-symbols.s.gz",
    "tools/locales/french-symbols.s.gz",
    "tools/locales/italian-symbols.s.gz",
    "tools/locales/german-symbols.s.gz",
    "tools/locales/japanese-symbols.s.gz",
    # The mountains' relief marked by hand in the voxel editor: JSON of cell
    # levels and shapes, the port's own data.
    "3ds_port/assets/voxel/relief_fixes.json",
    # the same file as the builders' voxel generators read it
    "Emerald3DS-v*-Windows/payload/voxelgen/assets/voxel/relief_fixes.json",
    "payload/voxelgen/assets/voxel/relief_fixes.json",
    "Emerald3DS-v*-Windows/Emerald3DS-Builder.exe",
    "Emerald3DS-v*-Windows/emerald3ds-builder-cli.exe",
    "Emerald3DS-v*-Windows/payload/Emerald3DS.3dsx",
    # the other languages' executables (payload/es/, fr/, it/, de/ and ja/)
    "Emerald3DS-v*-Windows/payload/*/Emerald3DS.3dsx",
    # the same executables inside Emerald3DS-WebPayload.zip
    "payload/Emerald3DS.3dsx",
    "payload/*/Emerald3DS.3dsx",
    # Recipes carry the precompiled voxel programs (docs/VOXEL_PRECOMPILE.md):
    # the port's own geometry and tables, and the game's texels only as
    # references into the ROM. The audit decompresses them, scans them for the
    # ROM's bytes and fails on any texel written literally (audit_programs).
    "Emerald3DS-v*-Windows/payload/emerald3ds.recipe",
    "Emerald3DS-v*-Windows/payload/*/emerald3ds.recipe",
    "payload/emerald3ds.recipe",
    "payload/*/emerald3ds.recipe",
]

